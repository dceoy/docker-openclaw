---
x-openclaw-build: &openclaw-build
  context: .
  dockerfile: Dockerfile
  platforms:
    - linux/amd64
    - linux/arm64
  tags:
    - ${OPENCLAW_IMAGE:-openclaw:local}
  args:
    OPENCLAW_NODE_VERSION: ${OPENCLAW_NODE_VERSION:-22}
    OPENCLAW_VERSION: ${OPENCLAW_VERSION:-latest}
    USER_NAME: ${OPENCLAW_USER_NAME:-claw}
    USER_UID: ${OPENCLAW_USER_UID:-1001}
    USER_GID: ${OPENCLAW_USER_GID:-1001}
    OPENCLAW_DOCKER_APT_PACKAGES: ${OPENCLAW_DOCKER_APT_PACKAGES:-}
    OPENCLAW_INSTALL_BROWSER: ${OPENCLAW_INSTALL_BROWSER:-}
    OPENCLAW_INSTALL_DOCKER_CLI: ${OPENCLAW_INSTALL_DOCKER_CLI:-}

x-openclaw-environment: &openclaw-environment
  HOME: /home/${OPENCLAW_USER_NAME:-claw}
  TERM: xterm-256color
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
  OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
  OPENCLAW_BROWSER_DISABLE_GRAPHICS_FLAGS: ${OPENCLAW_BROWSER_DISABLE_GRAPHICS_FLAGS:-}
  OPENCLAW_BROWSER_DISABLE_EXTENSIONS: ${OPENCLAW_BROWSER_DISABLE_EXTENSIONS:-}
  OPENCLAW_BROWSER_RENDERER_PROCESS_LIMIT: ${OPENCLAW_BROWSER_RENDERER_PROCESS_LIMIT:-}
  CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
  CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
  CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

x-openclaw-volumes: &openclaw-volumes
  - ${OPENCLAW_CONFIG_DIR:-./.openclaw}:/home/${OPENCLAW_USER_NAME:-claw}/.openclaw
  - ${OPENCLAW_WORKSPACE_DIR:-./workspace}:/home/${OPENCLAW_USER_NAME:-claw}/.openclaw/workspace

services:
  openclaw-gateway:
    container_name: openclaw-gateway
    hostname: openclaw-gateway
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    build: *openclaw-build
    environment: *openclaw-environment
    volumes: *openclaw-volumes
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    restart: unless-stopped
    command:
      [
        "gateway",
        "--allow-unconfigured",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  openclaw-cli:
    container_name: openclaw-cli
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *openclaw-environment
      BROWSER: echo
    volumes: *openclaw-volumes
    stdin_open: true
    tty: true
    depends_on:
      - openclaw-gateway
